<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><title>Tivorah form definitions</title></head>
  <body>
    <form name="tivorah-waitlist" method="POST" data-netlify="true" netlify-honeypot="website" hidden>
      <input name="name" type="text">
      <input name="email" type="email">
      <input name="consent" type="text">
      <input name="source" type="text">
      <input name="website" type="text">
    </form>
    <form name="tivorah-unsubscribe" method="POST" data-netlify="true" netlify-honeypot="website" hidden>
      <input name="email" type="email">
      <input name="website" type="text">
    </form>
    <form name="tivorah-contact" method="POST" data-netlify="true" netlify-honeypot="website" hidden>
      <input name="name" type="text">
      <input name="email" type="email">
      <input name="topic" type="text">
      <input name="subject" type="text">
      <textarea name="message"></textarea>
      <input name="source" type="text">
      <input name="website" type="text">
    </form>
  </body>
</html>
